<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/retro.css">
</head>
<body>
<script src="../js/db.js?v=4"></script>
<script src="../js/shell.js?v=4"></script>
<script>
(function () {
  var shell = GameShell.start({
    id: 'snake', title: 'SNAKE', icon: '🐍',
    width: 480, height: 480,
    keys: ['left', 'right', 'up', 'down'],
    controls: ['ARROW / WASD = ARAH', 'MAKAN × , TUMBUH', 'JANGAN TABRAK DINDING/DIRI']
  });

  var ctx = shell.ctx;
  var CELL = 24, COLS = 20, ROWS = 20;
  var snake, dir, nextDir, food, score, speed, timer, dead, started;

  function reset() {
    snake = [{x: 9, y: 10}, {x: 8, y: 10}, {x: 7, y: 10}];
    dir = {x: 1, y: 0}; nextDir = dir;
    score = 0; speed = 130; dead = false; started = false;
    placeFood();
    shell.setHud({ SCORE: 0, LENGTH: snake.length, SPEED: 'x1' });
    loop();
  }

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(function (s) { return s.x === food.x && s.y === food.y; }));
  }

  function setDir(d) {
    if (!started) started = true;
    if (d === 'left' && dir.x !== 1) nextDir = {x: -1, y: 0};
    if (d === 'right' && dir.x !== -1) nextDir = {x: 1, y: 0};
    if (d === 'up' && dir.y !== 1) nextDir = {x: 0, y: -1};
    if (d === 'down' && dir.y !== -1) nextDir = {x: 0, y: 1};
  }

  ['left', 'right', 'up', 'down'].forEach(function (d) {
    shell.on(d, function () { setDir(d); });
  });

  function loop() {
    clearTimeout(timer);
    if (!dead) {
      step();
      draw();
      speed = Math.max(60, 130 - score / 2);
      shell.updateHud('SPEED', 'x' + (130 / speed).toFixed(1));
      timer = setTimeout(loop, speed);
    }
  }

  function step() {
    if (!started) return;
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
        snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      dead = true;
      draw();
      shell.gameOver(score);
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      shell.updateHud('SCORE', score);
      shell.updateHud('LENGTH', snake.length);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function draw() {
    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, 480, 480);
    // grid dots
    ctx.fillStyle = '#10101c';
    for (var x = 0; x < COLS; x++) for (var y = 0; y < ROWS; y++) ctx.fillRect(x * CELL + 10, y * CELL + 10, 2, 2);
    // food
    ctx.fillStyle = '#ff3355';
    ctx.fillRect(food.x * CELL + 4, food.y * CELL + 4, CELL - 8, CELL - 8);
    // snake
    snake.forEach(function (s, i) {
      ctx.fillStyle = i === 0 ? '#33ff66' : (i % 2 ? '#1fbb4a' : '#28dd58');
      ctx.fillRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4);
    });
    if (!started) centerText('PRESS ARROW TO START', '#ffb000');
    if (dead) centerText('GAME OVER', '#ff3355');
  }

  function centerText(t, color) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 200, 480, 80);
    ctx.fillStyle = color;
    ctx.font = '16px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(t, 240, 246);
    ctx.textAlign = 'left';
  }

  reset();
})();
</script>
</body>
</html>
