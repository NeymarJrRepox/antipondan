<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/retro.css">
</head>
<body>
<script src="../js/db.js?v=4"></script>
<script src="../js/shell.js?v=4"></script>
<script>
(function () {
  var shell = GameShell.start({
    id: 'mario', title: 'SUPER MARIO RUN', icon: '🍄',
    width: 640, height: 420,
    keys: ['left', 'right', 'up'],
    controls: ['LEFT/RIGHT = JALAN', 'UP/SPACE = LOMPAT', 'AMBIL KOIN +10', 'HINDARI GOOMBA', 'CAPAI 🚩 = +500']
  });

  var ctx = shell.ctx;
  var W = 640, H = 420, GROUND = 370;
  var player, coins, enemies, flag, cam, score, dead, won, keys, raf;

  // level tiles: platform [x, y, w, h]
  var platforms = [
    [0, GROUND, 2400, 50],
    [180, 290, 80, 20], [300, 230, 80, 20], [450, 290, 100, 20],
    [640, 250, 60, 20], [760, 300, 120, 20],
    [950, 270, 80, 20], [1100, 220, 80, 20], [1250, 280, 100, 20],
    [1450, 300, 80, 20], [1600, 250, 100, 20], [1800, 290, 90, 20],
    [2000, 250, 120, 20]
  ];
  var gaps = [[420, 500], [900, 940], [1350, 1420], [1700, 1780]];

  function reset() {
    player = { x: 30, y: GROUND - 30, w: 26, h: 30, vx: 0, vy: 0, onGround: true };
    coins = [
      [200, 250], [320, 190], [470, 250], [660, 210], [790, 260],
      [970, 230], [1120, 180], [1270, 240], [1470, 260], [1620, 210],
      [1820, 250], [2020, 210]
    ].map(function (c) { return { x: c[0], y: c[1], got: false }; });
    enemies = [
      { x: 380, y: GROUND - 24, dir: -1 }, { x: 700, y: GROUND - 24, dir: -1 },
      { x: 1050, y: GROUND - 24, dir: -1 }, { x: 1400, y: GROUND - 24, dir: 1 },
      { x: 1750, y: GROUND - 24, dir: -1 }, { x: 1950, y: GROUND - 24, dir: 1 }
    ];
    flag = { x: 2320, y: GROUND - 60 };
    cam = 0; score = 0; dead = false; won = false; keys = {};
    shell.setHud({ SCORE: 0, COINS: '0/12', POS: '0m' });
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  }

  shell.on('left', function (d) { keys.left = d; });
  shell.on('right', function (d) { keys.right = d; });
  shell.on('up', function (d) {
    keys.up = d;
    if (d && player.onGround && !dead && !won) { player.vy = -11.5; player.onGround = false; }
  });

  function tick() {
    if (!dead && !won) {
      player.vx = keys.left ? -3.2 : keys.right ? 3.2 : 0;
      player.x += player.vx;
      player.vy += 0.55;
      player.y += player.vy;
      player.onGround = false;

      // platform collision
      platforms.forEach(function (p) {
        if (player.x + player.w > p[0] && player.x < p[0] + p[2] &&
            player.y + player.h > p[1] && player.y + player.h < p[1] + 26 &&
            player.vy >= 0) {
          player.y = p[1] - player.h;
          player.vy = 0;
          player.onGround = true;
        }
      });

      // lubang = mati
      if (player.y > H + 60) return die();

      // koin
      coins.forEach(function (c) {
        if (!c.got && Math.abs(c.x - player.x) < 24 && Math.abs(c.y - player.y) < 30) {
          c.got = true;
          score += 10;
          shell.updateHud('SCORE', score);
          shell.updateHud('COINS', coins.filter(function (x) { return x.got; }).length + '/' + coins.length);
        }
      });

      // musuh
      enemies.forEach(function (e) {
        e.x += e.dir * 1.1;
        if (e.x < 340 || e.x > 2280) e.dir *= -1;
        if (Math.abs(e.x - player.x) < 24 && Math.abs(e.y - player.y) < 26) {
          if (player.vy > 2) {
            e.x = -999; // musuh dipijak
            player.vy = -8;
            score += 30;
            shell.updateHud('SCORE', score);
          } else {
            die();
          }
        }
      });

      // bendera = menang
      if (player.x + player.w > flag.x) {
        won = true;
        score += 500;
        shell.updateHud('SCORE', score);
        shell.gameOver(score);
      }

      // kamera
      cam = Math.max(0, Math.min(player.x - 250, 2400 - W));
      shell.updateHud('POS', Math.floor(player.x / 10) + 'm');
    }
    draw();
    if (!dead && !won) raf = requestAnimationFrame(tick);
  }

  function die() {
    dead = true;
    draw();
    shell.gameOver(score);
  }

  function draw() {
    // langit
    ctx.fillStyle = '#101a3a';
    ctx.fillRect(0, 0, W, H);
    // awan
    ctx.fillStyle = '#2a2a55';
    [[60, 60], [300, 40], [520, 70]].forEach(function (c) {
      ctx.fillRect(c[0] - cam * 0.3 % W, c[1], 60, 12);
      ctx.fillRect(c[0] + 12 - cam * 0.3 % W, c[1] - 10, 36, 10);
    });

    ctx.save();
    ctx.translate(-cam, 0);

    // tanah (dengan gap)
    var segs = [[0, 420], [500, 900], [940, 1350], [1420, 1700], [1780, 2400]];
    segs.forEach(function (s) {
      ctx.fillStyle = '#2a5a2a';
      ctx.fillRect(s[0], GROUND, s[1] - s[0], H - GROUND);
      ctx.fillStyle = '#1a3a1a';
      ctx.fillRect(s[0], GROUND, s[1] - s[0], 8);
    });
    // platform
    platforms.slice(1).forEach(function (p) {
      ctx.fillStyle = '#8a5a2a';
      ctx.fillRect(p[0], p[1], p[2], p[3]);
      ctx.fillStyle = '#c98a4a';
      ctx.fillRect(p[0], p[1], p[2], 5);
    });
    // koin
    coins.forEach(function (c) {
      if (!c.got) {
        ctx.fillStyle = '#ffdd44';
        ctx.fillRect(c.x - 7, c.y - 7, 14, 14);
        ctx.fillStyle = '#a08010';
        ctx.fillRect(c.x - 3, c.y - 7, 2, 14);
      }
    });
    // musuh (goomba)
    enemies.forEach(function (e) {
      if (e.x > -100) {
        ctx.fillStyle = '#8a4a2a';
        ctx.fillRect(e.x - 12, e.y - 10, 24, 20);
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(e.x - 8, e.y - 4, 5, 5);
        ctx.fillRect(e.x + 3, e.y - 4, 5, 5);
      }
    });
    // bendera
    ctx.fillStyle = '#cfd2e0';
    ctx.fillRect(flag.x, flag.y, 4, 60);
    ctx.fillStyle = '#ff3355';
    ctx.fillRect(flag.x + 4, flag.y, 18, 12);
    // player
    ctx.fillStyle = '#ff3355';
    ctx.fillRect(player.x, player.y, player.w, player.h - 8);
    ctx.fillStyle = '#3366ff';
    ctx.fillRect(player.x, player.y + 22, player.w, 8);
    ctx.fillStyle = '#ffd9b3';
    ctx.fillRect(player.x + 4, player.y + 2, 18, 8);

    ctx.restore();

    if (dead) bar('GAME OVER', '#ff3355');
    if (won) bar('LEVEL CLEAR! +500', '#33ff66');
  }
  function bar(t, color) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 170, W, 80);
    ctx.fillStyle = color;
    ctx.font = '18px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(t, W / 2, 218);
    ctx.textAlign = 'left';
  }

  reset();
})();
</script>
</body>
</html>
