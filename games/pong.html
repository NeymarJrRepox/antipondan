<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/retro.css">
</head>
<body>
<script src="../js/db.js?v=4"></script>
<script src="../js/shell.js?v=4"></script>
<script>
(function () {
  var shell = GameShell.start({
    id: 'pong', title: 'PONG', icon: '🏓',
    width: 640, height: 420,
    keys: ['up', 'down'],
    controls: ['UP/DOWN = GERAK PADDLE', 'KALAHKAN CPU (5 Poin = Menang)', 'SETIAP KEMENANGAN = +100 x LEVEL']
  });

  var ctx = shell.ctx;
  var W = 640, H = 420;
  var player, cpu, ball, pScore, cScore, round, dead, won, raf, speedMul;

  function reset() {
    player = { y: H / 2 - 40 };
    cpu = { y: H / 2 - 40 };
    pScore = 0; cScore = 0; round = 1; dead = false; won = false;
    speedMul = 1;
    serveBall();
    shell.setHud({ YOU: 0, CPU: 0, LEVEL: 1 });
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  }

  function serveBall() {
    ball = {
      x: W / 2, y: H / 2,
      vx: (Math.random() < 0.5 ? -1 : 1) * (3.4 + round * 0.4),
      vy: (Math.random() - 0.5) * 4
    };
  }

  shell.on('up', function (d) { player.up = d; });
  shell.on('down', function (d) { player.down = d; });

  function tick() {
    if (!dead && !won) {
      // player paddle
      if (player.up) player.y -= 6;
      if (player.down) player.y += 6;
      player.y = Math.max(0, Math.min(H - 80, player.y));

      // cpu AI (dengan sedikit "bodoh" biar bisa dikalahkan)
      var target = ball.y - 40 + Math.sin(Date.now() / 300) * 30 * (1.4 - round * 0.08);
      if (cpu.y + 30 < target) cpu.y += 3.4 + round * 0.15;
      else if (cpu.y + 30 > target) cpu.y -= 3.4 + round * 0.15;
      cpu.y = Math.max(0, Math.min(H - 80, cpu.y));

      // ball
      ball.x += ball.vx;
      ball.y += ball.vy;
      if (ball.y < 6 || ball.y > H - 6) ball.vy *= -1;

      // tabrak paddle player (kiri)
      if (ball.x < 34 && ball.x > 20 && ball.y > player.y && ball.y < player.y + 80 && ball.vx < 0) {
        ball.vx *= -1.06;
        ball.vy += ((ball.y - (player.y + 40)) / 40) * 2.5;
      }
      // tabrak paddle cpu (kanan)
      if (ball.x > W - 34 && ball.x < W - 20 && ball.y > cpu.y && ball.y < cpu.y + 80 && ball.vx > 0) {
        ball.vx *= -1.06;
        ball.vy += ((ball.y - (cpu.y + 40)) / 40) * 2.5;
      }

      // skor
      if (ball.x < -10) { cScore++; shell.updateHud('CPU', cScore); endRound(false); }
      if (ball.x > W + 10) { pScore++; shell.updateHud('YOU', pScore); endRound(true); }
    }
    draw();
    if (!dead && !won) raf = requestAnimationFrame(tick);
  }

  function endRound(playerWon) {
    if (pScore >= 5) {
      won = true;
      shell.gameOver(pScore * 100 * round);
      return;
    }
    if (cScore >= 5) {
      dead = true;
      shell.gameOver(pScore * 100);
      return;
    }
    round = 1 + Math.floor((pScore + cScore) / 4);
    shell.updateHud('LEVEL', round);
    serveBall();
  }

  function draw() {
    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, W, H);
    // net
    ctx.strokeStyle = '#2a2a44';
    ctx.setLineDash([8, 10]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);
    // skor besar di background
    ctx.fillStyle = '#1a1a2e';
    ctx.font = '48px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(pScore, W / 2 - 80, 70);
    ctx.fillText(cScore, W / 2 + 80, 70);
    ctx.textAlign = 'left';
    // paddles
    ctx.fillStyle = '#33ff66';
    ctx.fillRect(20, player.y, 12, 80);
    ctx.fillStyle = '#ff3355';
    ctx.fillRect(W - 32, cpu.y, 12, 80);
    // ball
    ctx.fillStyle = '#cfd2e0';
    ctx.fillRect(ball.x - 6, ball.y - 6, 12, 12);

    if (won) bar('YOU WIN! +100/POINT x LEVEL', '#33ff66');
    if (dead) bar('GAME OVER', '#ff3355');
  }
  function bar(t, color) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 160, W, 80);
    ctx.fillStyle = color;
    ctx.font = '14px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(t, W / 2, 208);
    ctx.textAlign = 'left';
  }

  reset();
})();
</script>
</body>
</html>
